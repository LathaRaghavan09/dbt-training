version: 2

models:
  - name: Customer
    columns:
      - name: customerid
        description: Testing customerid is a primary key
        tests:
          - unique
          - not_null
      - name: customername
        description: Testing customername is not-null
        tests:
          - not_null
      - name: SEGMENT
        tests:
          - accepted_values:
              values:
                - "Consumer"
                - "Home Office"
                - "Corporate"
      - name: country
        tests:
          - not_null
          - accepted_values:
              values:
                - "United States"
                - "xyz"

